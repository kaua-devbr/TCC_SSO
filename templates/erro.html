
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro | Portal do Aluno</title>
    <link rel="stylesheet" href="static/css/erro.css">
</head>
<body>

    <main class="error-container">
        <div class="error-icon">
            <span>!</span>
        </div>

        <h1>Ops! Algo deu errado.</h1>

        <p class="error-message">
            Ocorreu um problema inesperado durante o uso do sistema.
            Tente novamente em alguns instantes.
        </p>

        <p class="error-code">
            Código do erro: <strong>500</strong>
        </p>

        <div class="error-actions">
            <a href="/" class="primary-button">Voltar ao início</a>
            <a href="javascript:history.back()" class="secondary-button">
                Tentar novamente
            </a>
        </div>

        <footer>
            Portal do Aluno
        </footer>
    </main>

</body>
</html>
